kind = "web"
previewPath = "/"
title = "OMNICON"
version = "1.0.0"
id = "artifacts/omnicon"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21193

[services.development]
run = "pnpm --filter @workspace/omnicon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/omnicon", "run", "build" ]
publicDir = "artifacts/omnicon/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21193"
BASE_PATH = "/"
